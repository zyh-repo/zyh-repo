# ZYH 自用 越狱源 —— 云端自动同步插件（GitHub Actions · 标准目录版）
#
# 仓库根即站点根：debs/、icons/、assets/、tools/ 直接放在仓库里，
# GitHub Pages 原样发布，不需要扁平部署包，也不需要 zyh-sync.zip。
#
# 用途：每天定时按 sync-sources.txt 拉取插件（保持原文件名，放入 debs/），
#       重建索引、全量校验，有变化自动提交 → GitHub Pages 自动更新。
#
# 已不需要的旧文件：zyh-sync.zip、根目录下的 1000.deb / 1122.deb 等扁平文件
# （从电脑重新上传标准目录结构后即可删除）。

name: ZYH 自动同步插件

on:
  schedule:
    # 每天 UTC 20:00 = 北京时间次日 04:00
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zyh-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 同步插件（下载→校验→导入 debs/→重建索引→全量校验）
        env:
          MIRROR_VERIFY_SSL: "1"
          TMPDIR: /tmp/zyh-tmp
        run: |
          mkdir -p /tmp/zyh-tmp && chmod 777 /tmp/zyh-tmp
          bash tools/mirror.sh sync --publish

      - name: 提交并推送变更
        run: |
          git config user.name "zyh-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本次同步无变化，跳过提交"
          else
            git commit -m "自动同步插件（$(date -u +%Y-%m-%d)）"
            git push
          fi
