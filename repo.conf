# ============================================================
#  ZYH 自用 越狱源 配置
#  改完保存后运行：./tools/build.sh   （或 ./tools/set-url.sh 专门改地址）
# ============================================================

# 源显示信息（Sileo / Zebra / Cydia 里看到的名字）
REPO_ORIGIN="ZYH 自用"
REPO_LABEL="ZYH 自用"
REPO_SUITE="stable"
REPO_VERSION="1.0"
REPO_CODENAME="zyh"
REPO_DESC="ZYH 的个人自用越狱源"
REPO_DESC_LINE2="收录自用插件与工具，按需发布。"

# 源托管地址：留空表示还没托管（此时不写包图标/精选横幅字段）。
# 例如：BASE_URL="https://zyh.github.io/zyh-repo"
BASE_URL="https://zyh-repo.github.io/zyh-repo"

# Sileo 精选横幅（可选）：FEATURED_PACKAGE 填了包名才会生成 sileo-featured.json；
# 横幅图默认用 assets/banner.png。不需要精选横幅就留空。
FEATURED_TITLE=""
FEATURED_PACKAGE=""
FEATURED_IMAGE="assets/banner.png"
